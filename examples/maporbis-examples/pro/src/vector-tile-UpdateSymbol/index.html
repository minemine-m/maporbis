<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>矢量瓦片图层演示 - MapOrbis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="/utils/inline-utils.js"></script>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .orbis-control-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      z-index: 1000;
    }

    .control-section {
      margin-bottom: 15px;
    }

    .control-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--orbis-text-secondary);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .color-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .color-btn:hover {
      transform: scale(1.1);
    }

    .color-btn.active {
      border-color: var(--orbis-text-primary);
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--orbis-gray-3);
      transition: .4s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--orbis-blue); }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>

<body class="orbis-body">
  <div id="map"></div>

  <div class="orbis-control-panel">
    <div class="orbis-panel orbis-shadow-lg">
      <div class="orbis-panel-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; font-size: 15px; font-weight: 600;">
          <i class="fas fa-layer-group" style="color: var(--orbis-blue)"></i>
          矢量瓦片演示 (MVT)
        </h3>
        <button class="orbis-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题 (测试 setPaint)"></button>
      </div>

      <div class="orbis-panel-body">
        <!-- 图层控制 -->
        <div class="control-section">
          <div class="control-label">
            图层可见性
            <label class="switch">
                <input type="checkbox" checked onchange="toggleLayer(this.checked)">
                <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- 颜色选择 -->
        <div class="control-section">
          <div class="control-label">线条颜色 (测试 updateSymbol)</div>
          <div class="color-grid" id="colorGroup">
            <button class="color-btn active" style="background: #FFFFFF" onclick="setColor('#FFFFFF', this)"></button>
            <button class="color-btn" style="background: #34C759" onclick="setColor('#34C759', this)"></button>
            <button class="color-btn" style="background: #FF3B30" onclick="setColor('#FF3B30', this)"></button>
            <button class="color-btn" style="background: #FF9500" onclick="setColor('#FF9500', this)"></button>
            <button class="color-btn" style="background: #007AFF" onclick="setColor('#007AFF', this)"></button>
          </div>
        </div>

        <div class="control-section">
            <div class="control-label">数据源说明</div>
            <p style="font-size: 12px; color: var(--orbis-text-tertiary); margin: 0;">
                使用 MapTiler OpenStreetMap 矢量切片服务 (.pbf)。
            </p>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
        "three-stdlib": "https://unpkg.com/three-stdlib@2.29.4/index.js"
      }
    }
  </script>

  <script type="module">
    import * as maporbis from "maporbis";
    import { VectorTileLayer } from "maporbis";

    let map, vectorLayer;

    // MapTiler 免费 Key，用于演示
    const TILE_URL = "https://api.maptiler.com/tiles/v3/{z}/{x}/{y}.pbf?key=uKYsZQZpm72WlbSgH9B7";

    // 默认样式配置
    const state = {
      color: '#FFFFFF', // 默认白色
      theme: 'dark'
    };

    init();

    function init() {
      // 初始化地图
      map = new maporbis.Map("map", {
        state: {
          center: [139.767, 35.681, 15000], // 东京
        },
        source: {
          baseLayers: [
            // 使用暗色底图以突出矢量线条
                new maporbis.WMTSTileLayer("esri_imagery", {
              source: new maporbis.TileSource({
                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                projectionID: "3857",
              }),
              projection: maporbis.ProjectionFactory.create("3857"),
              minLevel: 2,
              maxLevel: 18,

            }),
          ],
        },
        renderer: {
            useWebGPU: false,
            skybox: {
                hdr: "/assets/image/hdr/kloofendal_48d_partly_cloudy_puresky_2k.hdr",
                hdrExposure: 0.5,
                defaultColor: "#111111",
            }
        }
      });

      map.on("load", () => {
        addVectorLayer();
        notify("地图加载完成", "success");
      });
    }

    function addVectorLayer() {
        if (vectorLayer) {
            map.removeLayer("mvt-layer");
        }

        // 创建矢量瓦片图层
        vectorLayer = new VectorTileLayer("mvt-layer", {
            source: new maporbis.TileSource({
                url: TILE_URL,
                projectionID: "3857",
                dataType: "vector-tile"
            }),
            projection: maporbis.ProjectionFactory.create("3857"),
            style: getDarkThemeStyle(state.color),
            altitude: 5 // 稍微抬高避免 Z-fighting
        });

        map.addLayer(vectorLayer);
    }

    function getDarkThemeStyle(lineColor) {
        return [
            {
                filter: ['==', ['get', '$type'], 'LineString'],
                paint: {
                    type: 'line',
                    color: lineColor,
                    width: 2,
                    opacity: 0.8,
                    transparent: true
                }
            },
            // {
            //     filter: ['==', ['get', '$type'], 'Point'],
            //     paint: {
            //         type: "icon",
            //         url: "https://a.amap.com/jsapi_demos/static/demo-center/icons/poi-marker-default.png",
            //         size: 5,
            //         sizeAttenuation: false,
            //         anchor: 'bottom-left',
            //     }
            // }
        ];
    }

    function getLightThemeStyle(lineColor) {
        return [
             {
                filter: ['==', ['get', '$type'], 'LineString'],
                paint: {
                    type: 'line',
                    color: '#000000', // 亮色主题下线条为黑色
                    width: 3,
                    opacity: 1.0,
                    transparent: false
                }
            },
            {
                filter: ['==', ['get', '$type'], 'Point'],
                paint: {
                    type: "circle",
                    radius: 5,
                    color: '#FF0000'
                }
            }
        ];
    }

    // 暴露给全局的控制函数
    window.toggleLayer = (checked) => {
        if (vectorLayer) {
            vectorLayer.visible = checked;
            // 同步 renderer 可见性
            const renderer = vectorLayer._getRenderer();
            if (renderer) {
                renderer.visible = checked;
            }
        }
    };

    window.setColor = (color, btn) => {
      state.color = color;

      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (vectorLayer) {
        // 使用新实现的 updateSymbol 方法
        // 假设 LineString 是第一个规则 (index 0)
        vectorLayer.updateSymbol(0, {
            type: 'line',
            color: color,
            width: 2,
            opacity: 0.8,
            transparent: true
        });
        notify(`颜色更新为 ${color}`, 'info');
      }
    };

    window.toggleTheme = () => {
        if (!vectorLayer) return;

        if (state.theme === 'dark') {
            state.theme = 'light';
            // 测试 setPaint 方法
            vectorLayer.setPaint(getLightThemeStyle(state.color));
            notify('切换到亮色主题 (setPaint)', 'success');
        } else {
            state.theme = 'dark';
            // 测试 setPaint 方法
            vectorLayer.setPaint(getDarkThemeStyle(state.color));
            notify('切换到暗色主题 (setPaint)', 'success');
        }
    };

  </script>
</body>
</html>
